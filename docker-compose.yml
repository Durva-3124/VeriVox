version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Auth: comma-separated "key:role" pairs
      # VERIVOX_API_KEYS: "changeme:admin,streamkey:stream"
      VERIVOX_RATE_LIMIT: "120"
      VERIVOX_RATE_WINDOW: "60"
    volumes:
      # Mount ONNX model so it doesn't need to be baked into the image
      - ./model/export:/app/model/export:ro
      - ./model/.speechbrain_cache:/app/model/.speechbrain_cache:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_WS_URL=ws://backend:8000/stream
    depends_on:
      - backend
    restart: unless-stopped
